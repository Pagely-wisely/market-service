spring:
  application:
    name: marketservice

  config:
    import: optional:file:market-service/.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${MARKET_DB_NAME:pagely_market}
    username: ${DB_USERNAME:postgre}
    password: ${DB_PASSWORD:postgre}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: info

server:
  port: 19031

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8000/eureka/
